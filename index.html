<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商用統計學期中考 | 全範圍作業視覺化速查系統</title>
    <style>
        :root {
            --bg-base: #F8FAFC;
            --bg-surface: #FFFFFF;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #64748B;
            --border-subtle: #E2E8F0;
            --border-strong: #CBD5E1;
            --navy-primary: #0F2847;
            --navy-accent: #1F4E79;
            --emerald-bg: #ECFDF5;
            --emerald-border: #10B981;
            --emerald-text: #065F46;
            --accent-red: #DC2626;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 14px rgba(0,0,0,0.06);
        }

        [data-theme="dark"] {
            --bg-base: #0B1120;
            --bg-surface: #131D33;
            --bg-card: #18233D;
            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --border-subtle: #243252;
            --border-strong: #33446B;
            --navy-primary: #1E3A8A;
            --navy-accent: #3B82F6;
            --emerald-bg: #064E3B;
            --emerald-border: #059669;
            --emerald-text: #A7F3D0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--navy-primary) 0%, #1E3E62 100%);
            color: white;
            padding: 32px 24px 28px;
            box-shadow: 0 4px 20px rgba(15, 40, 71, 0.25);
        }
        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .brand-pill {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .header-sub { font-size: 14px; opacity: 0.85; margin-top: 4px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }

        /* Main Container */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* Alert Banner */
        .alert-banner {
            background: #FEF2F2;
            border: 1.5px solid #F87171;
            border-left: 6px solid #DC2626;
            border-radius: var(--radius-md);
            padding: 14px 18px;
            margin-bottom: 24px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            color: #7F1D1D;
        }
        .alert-banner strong { color: #B91C1C; font-size: 15px; }

        /* Toolbar */
        .toolbar {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1.5px solid var(--border-strong);
            border-radius: 10px;
            outline: none;
            background: var(--bg-card);
            color: var(--text-primary);
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--navy-accent); }
        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }
        .tab-btn {
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .tab-btn:hover { border-color: var(--navy-accent); color: var(--navy-accent); }
        .tab-btn.active {
            background: var(--navy-accent);
            border-color: var(--navy-accent);
            color: white;
        }

        /* Grid & Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.08); }
        .card-header {
            background: var(--navy-primary);
            color: white;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title { font-size: 15px; font-weight: 700; }
        .card-pill {
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
        .q-box {
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-left: 4px solid var(--navy-accent);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13.5px;
            color: var(--text-secondary);
        }
        .calc-box {
            background: var(--bg-surface);
            border: 1.5px solid var(--border-strong);
            border-radius: 8px;
            padding: 12px;
        }
        .calc-title { font-size: 12.5px; font-weight: 700; color: var(--navy-accent); margin-bottom: 8px; }
        .calc-step { font-size: 13px; margin-bottom: 6px; }
        .calc-step .step-badge {
            display: inline-block;
            background: #E2E8F0;
            color: #1E293B;
            font-size: 11px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            margin-right: 6px;
        }
        .ans-badge {
            background: var(--emerald-bg);
            border: 1.2px solid var(--emerald-border);
            border-left: 4px solid var(--emerald-border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--emerald-text);
        }
        .chart-preview {
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            background: white;
            text-align: center;
        }
        .chart-preview img { width: 100%; height: 180px; object-fit: contain; display: block; }
        .chart-caption { font-size: 11.5px; color: var(--text-muted); padding: 4px; background: var(--bg-base); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.open { display: flex; }
        .modal-content {
            max-width: 900px;
            width: 100%;
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            position: relative;
        }
        .modal-content img { width: 100%; height: auto; max-height: 75vh; object-fit: contain; }
        .close-btn {
            position: absolute;
            top: 12px; right: 16px;
            font-size: 26px;
            font-weight: bold;
            color: var(--text-primary);
            cursor: pointer;
        }
    </style>
</head>

尺度，通常為計數的結果。量變數為離散型或連續型，其結果有自然的順序，可使用區間或比例的測量尺度；\nb. 兩種變數皆可用於樣本或母體。", "fig": "figures/ch2_q23.png", "card_img": "figures/cards/card_calc_ch2_q23.png", "lines": [], "badge": ""}, {"id": "calc_ch2_q25", "chapter": 2, "chapter_name": "次數表、次數分配與圖形的呈現", "q_num": "第 2 章 習題 25", "title": "次數表與長條圖、圓形圖之商務決策呈現", "question": "Myrtle Beach 度假村調查顧客最喜歡的休閒活動，結果包含沒有計畫、健行、泛舟與泡溫泉等。\na. 這是哪一種表格？\nb. 繪製長條圖。\nc. 繪製圓形圖。\nd. 哪一種圖形較好？為什麼？", "answer": "a. 次數表；  b. 長條圖如圖；  c. 圓形圖如圖；  d. 圓形圖較好，因為比較容易看出接近一半的旅客喜歡沒有計畫的休閒活動。", "fig": "figures/ch2_q25.png", "card_img": "figures/cards/card_calc_ch2_q25.png", "lines": [], "badge": ""}, {"id": "calc_ch2_q27", "chapter": 2, "chapter_name": "次數表、次數分配與圖形的呈現", "q_num": "第 2 章 習題 27", "title": "次數分配分組組數之判定（2^k 法則）", "question": "一組包含 83 筆觀測值的資料，建議分成幾組？", "answer": "2^6 = 64，2^7 = 128，建議分成 7 組。", "fig": "figures/ch2_q27.png", "card_img": "figures/cards/card_calc_ch2_q27.png", "lines": [], "badge": ""}, {"id": "calc_ch2_q29", "chapter": 2, "chapter_name": "次數表、次數分配與圖形的呈現", "q_num": "第 2 章 習題 29", "title": "員工通勤時間之次數分配表編製與分配特徵分析", "question": "25 位員工通勤時間（分鐘）資料如下：\n15, 23, 27, 31, 16, 24, 28, 33, 18, 25, 29, 35, 20, 26, 30, 38, 21, 26, 30, 42, 22, 27, 31, 48, 22\na. 建議分成幾組？\nb. 組距設定為多少？\nc. 第一組組下限為何？\nd. 整理成次數分配。\ne. 解釋次數分配的特徵。", "answer": "a. 5，因為 2^4 = 16 < 25 且 2^5 = 32 > 25；\nb. i ≥ (48 - 16)/5 = 6.4，組距使用 7；\nc. 15；\nd. 次數分配：15~22 (3), 22~29 (8), 29~36 (7), 36~43 (5), 43~50 (2)，總計 25；\ne. 通勤時間在 15 到 50 分鐘之間，最常見為 22 到 36 分鐘，超過 43 分鐘非常罕見。", "fig": "figures/ch2_q29.png", "card_img": "figures/cards/card_calc_ch2_q29.png", "lines": [], "badge": ""}, {"id": "calc_ch2_q31", "chapter": 2, "chapter_name": "次數表、次數分配與圖形的呈現", "q_num": "第 2 章 習題 31", "title": "大學生觀影次數分配建構與鐘形對稱性檢驗", "question": "45 位大學生上個月觀看電影的次數資料。\na. 建議分成幾組？\nb. 組距設定為多少？\nc. 第一組組下限為何？\nd. 整理成次數分配。\ne. 描述分配的形狀。", "answer": "a. 2^5 = 32，2^6 = 64，把全部資料分成 6 組；\nb. i = (10 - 1)/6 = 1.5，選擇組距為 2；\nc. 0；\nd. 次數分配：0~2 (1), 2~4 (5), 4~6 (12), 6~8 (17), 8~10 (8), 10~12 (2)；\ne. 此分配相當對稱或呈現鐘形分配，眾數在 4 以上至 8 這兩組之間。", "fig": "figures/ch2_q31.png", "card_img": "figures/cards/card_calc_ch2_q31.png", "lines": [], "badge": ""}, {"id": "calc_ch3_q43", "chapter": 3, "chapter_name": "數值的測量", "q_num": "第 3 章 習題 43", "title": "母體平均數與母體變異數之計算", "question": "考慮以下 5 筆母體數值：8, 3, 7, 3, 4。\na. 計算母體平均數。\nb. 計算母體變異數。", "answer": "a. 5；  b. 4.4，由 ((8-5)^2 + (3-5)^2 + (7-5)^2 + (3-5)^2 + (4-5)^2)/5 得到（標準差為 2.0976）。", "fig": "figures/ch3_q43.png", "card_img": "figures/cards/card_calc_ch3_q43.png", "lines": [], "badge": ""}, {"id": "calc_ch3_q53", "chapter": 3, "chapter_name": "數值的測量", "q_num": "第 3 章 習題 53", "title": "樣本平均數、樣本變異數與樣本標準差之計算", "question": "考慮以下 10 筆樣本數值：\n101, 95, 99, 93, 89, 97, 94, 98, 97, 88。\na. 計算樣本平均數。\nb. 計算樣本變異數與樣本標準差。", "answer": "a. x̄ = 951/10 = 95.1；  b. s^2 = 1,112.9/9 = 123.66，s = √123.66 = 11.12。", "fig": "figures/ch3_q53.png", "card_img": "figures/cards/card_calc_ch3_q53.png", "lines": [], "badge": ""}, {"id": "calc_ch3_q55", "chapter": 3, "chapter_name": "數值的測量", "q_num": "第 3 章 習題 55", "title": "柴比雪夫定理（Chebyshev's Theorem）之資料比例推估", "question": "根據柴比雪夫定理，至少有多少百分比的資料會落在平均數加減 1.8 個標準差之內？", "answer": "約 69%，由 1 - 1/(1.8)^2 得到（精確值為 69.14%）。", "fig": "figures/ch3_q55.png", "card_img": "figures/cards/card_calc_ch3_q55.png", "lines": [], "badge": ""}, {"id": "calc_ch3_q57", "chapter": 3, "chapter_name": "數值的測量", "q_num": "第 3 章 習題 57", "title": "常態鐘形分配之經驗法則（Empirical Rule）應用", "question": "某穀片包裝重量依循常態分配，平均數為 x̄，標準差為 s。\na. 大約有多少百分比的穀片盒重量會介於 x̄ - 2s 與 x̄ + 2s 之間？\nb. 大約有多少百分比的穀片盒重量會大於 x̄ + 2s？", "answer": "a. 約 95%；\nb. 鐘形分佈是對稱的。x̄ + 2s 是 95% 的一半，或是 47.5%。整條曲線是 100%；高於平均數的整個一半是 50%。所以，(50% - 47.5%) = 2.5% 的重量高於 x̄ + 2s。", "fig": "figures/ch3_q57.png", "card_img": "figures/cards/card_calc_ch3_q57.png", "lines": [], "badge": ""}, {"id": "calc_ch3_q59", "chapter": 3, "chapter_name": "數值的測量", "q_num": "第 3 章 習題 59", "title": "母體平均數、中位數與離差總和恆為零之證明", "question": "某法律事務所 5 位資深合夥人去年承辦案件數為：6, 4, 3, 7, 5。\na. 計算平均數與中位數。\nb. 這是母體平均數還是樣本平均數？為什麼？\nc. 證明數值與平均數之離差總和恆為 0：Σ(x - μ) = 0。", "answer": "a. 平均數 = 5，由 (6 + 4 + 3 + 7 + 5)/5 得到。中位數 = 5，由排序完後的數值 (3,4,5,6,7) 中選取中間的數值而得出；\nb. 母體平均數，因為資料來自所有的資深合夥人；\nc. Σ(x - μ) = (6 - 5) + (4 - 5) + (3 - 5) + (7 - 5) + (5 - 5) = 0。", "fig": "figures/ch3_q59.png", "card_img": "figures/cards/card_calc_ch3_q59.png", "lines": [], "badge": ""}, {"id": "calc_ch3_q65", "chapter": 3, "chapter_name": "數值的測量", "q_num": "第 3 章 習題 65", "title": "產品成本與長度之加權平均數（Weighted Mean）計算", "question": "某承包商購買三批圍籬，數量與每英尺價格分別為：270 英尺（每英尺 $5.00）、300 英尺（每英尺 $6.50）、100 英尺（每英尺 $8.00）。\n求每英尺圍籬的加權平均成本。", "answer": "x̄w = ($5.00(270) + $6.50(300) + $8.00(100)) / (270 + 300 + 100) = $4,100 / 670 = $6.12。", "fig": "figures/ch3_q65.png", "card_img": "figures/cards/card_calc_ch3_q65.png", "lines": [], "badge": ""}, {"id": "calc_ch3_q75", "chapter": 3, "chapter_name": "數值的測量", "q_num": "第 3 章 習題 75", "title": "阿波羅太空計畫飛行時間之母體平均數、中位數、全距與標準差", "question": "NASA 阿波羅計畫全部 13 次載人飛行任務的飛行時間（小時）資料。\na. 這是母體還是樣本？為什麼？\nb. 計算平均數與中位數。\nc. 計算全距與標準差。", "answer": "a. 因為資料中有 13 次飛行時間，所以全部的任務都考慮，為母體；\nb. μ = 2,259/13 = 173.77，中位數 = 195；\nc. 全距 = 301 - 7 = 294，s = √(133,846/13) = 101.47。", "fig": "figures/ch3_q75.png", "card_img": "figures/cards/card_calc_ch3_q75.png", "lines": [], "badge": ""}, {"id": "calc_ch3_q77", "chapter": 3, "chapter_name": "數值的測量", "q_num": "第 3 章 習題 77", "title": "大學生開銷平均數、標準差與 95% 經驗法則", "question": "25 位大學生每學期教科書開銷資料。\na. 計算平均數、中位數與眾數。\nb. 計算全距與標準差。\nc. 根據經驗法則，大約 95% 的開銷落在哪個區間？\nd. 若資料分組為 30 筆，計算分組平均數與標準差。", "answer": "a. 平均數為 $717.20，由 $17,930/25 得到。中位數為 $717.00。有兩個眾數 $710 與 $722；\nb. 全距為 $90，由 $771 - $681 = $90 得到，標準差為 $24.87，由取 14,850/24 的平方根得到；\nc. $667.46 至 $766.94，由 $717.20 ± 2($24.87) 得出；\nd. x̄ = 270/30 = 9.0，s = √(366/(30-1)) = 3.552。分組資料的平均數和標準差是實際數值的平均數和標準差的估計值。", "fig": "figures/ch3_q77.png", "card_img": "figures/cards/card_calc_ch3_q77.png", "lines": [], "badge": ""}, {"id": "calc_ch4_q5", "chapter": 4, "chapter_name": "展現與探索資料", "q_num": "第 4 章 習題 5", "title": "四分位數 (Quartiles) 定位計算", "question": "考慮以下 11 筆排序後的樣本資料：\n43, 47, 49, 51, 52, 53, 54, 55, 55, 56, 57。\n計算中位數、第一個四分位數 (Q1) 與第三個四分位數 (Q3)，並說明其意涵。", "answer": "中位數 = 53，由 (11 + 1)(1/2) 而得，所以是從最小的值算起，排序第六的數值。中位數表示 11 個觀測值中有 50% 小於 53；\nQ1 = 49，由 (11 + 1)(1/4) 而得，所以是從最小的值算起，排序第三的數值。第一個四分位數表示 11 個觀測值中有 25% 小於 49；\nQ3 = 55，由 (11 + 1)(3/4) 而得，所以是從最小的值算起，排序第九的數值。第三個四分位數表示 11 個觀測值中有 75% 小於 55。", "fig": "figures/ch4_q5.png", "card_img": "figures/cards/card_calc_ch4_q5.png", "lines": [], "badge": ""}, {"id": "calc_ch4_q9", "chapter": 4, "chapter_name": "展現與探索資料", "q_num": "第 4 章 習題 9", "title": "箱形圖 (Box Plot) 與離群值檢驗", "question": "課本圖形為某大都會區住屋價格的箱形圖。\na. 房屋價格的中位數是多少？\nb. 第一個四分位數與第三個四分位數是多少？\nc. 四分位距是多少？\nd. 離群值的上限是多少？\ne. 資料中是否存在離群值？\nf. 解釋資料分配的形狀。", "answer": "a. 800；  b. Q1 = 500，Q3 = 1,200；  c. 700，由 1,200 − 500 得出；  d. 離群值的上限是 1,200 + 1.5(700) = 1,200 + 1,050 = 2,250；  e. 沒有離群值；  f. 分配是正偏。", "fig": "figures/ch4_q9.png", "card_img": "figures/cards/card_calc_ch4_q9.png", "lines": [], "badge": ""}, {"id": "calc_ch4_q13", "chapter": 4, "chapter_name": "展現與探索資料", "q_num": "第 4 章 習題 13", "title": "會計系起薪點圖與皮爾森偏態係數", "question": "5 位剛畢業的會計系學生起薪（千美元）如下：36, 26, 33, 28, 31。\na. 計算平均數、中位數與標準差。\nb. 計算皮爾森偏態係數。\nc. 計算動差法軟體偏態係數。", "answer": "a. 平均數是 154/5 = 30.8，中位數是 31.0，標準差是 3.96，由 s = √(62.8/4) = 3.96；\nb. -0.15，由 3(30.8 - 31.0)/3.96 得出；\nc. 0.125，由 [5/(4 × 3)] × 0.301 得出。", "fig": "figures/ch4_q13.png", "card_img": "figures/cards/card_calc_ch4_q13.png", "lines": [], "badge": ""}, {"id": "calc_ch4_q19", "chapter": 4, "chapter_name": "展現與探索資料", "q_num": "第 4 章 習題 19", "title": "用餐時段與點甜點關聯列聯表分析", "question": "某餐廳記錄 200 位顧客的用餐時段（午餐或晚餐）以及是否點甜點。\na. 兩個變數的測量尺度為何？\nb. 這是哪一種表格？\nc. 超過一半的顧客點甜點嗎？\nd. 超過一半的午餐顧客點甜點嗎？\ne. 超過一半的晚餐顧客點甜點嗎？", "answer": "a. 兩個變數皆為名目尺度；  b. 列聯表；  c. 是的，因為有 58.5% 或超過一半的顧客點甜點；  d. 不是，因為只有 32% 的午餐顧客點甜點；  e. 是的，因為有 85% 的晚餐顧客點甜點。", "fig": "figures/ch4_q19.png", "card_img": "figures/cards/card_calc_ch4_q19.png", "lines": [], "badge": ""}, {"id": "calc_ch4_q23", "chapter": 4, "chapter_name": "展現與探索資料", "q_num": "第 4 章 習題 23", "title": "房貸再融資資料之百分位數與箱形圖繪製", "question": "20 位屋主房貸再融資金額（千美元）資料。\na. 計算中位數、第一四分位數 (Q1) 與第三四分位數 (Q3)。\nb. 計算第 26 百分位數 (P26) 與第 83 百分位數 (P83)。\nc. 繪製箱形圖。", "answer": "a. L50 = (20+1)(50/100) = 10.50，中位數 = (83.7 + 85.6)/2 = 84.65；L25 = 5.25，Q1 = 66.6 + 0.25(72.9 - 66.6) = 68.175；L75 = 15.75，Q3 = 87.1 + 0.75(90.2 - 87.1) = 89.425；\nb. L26 = 5.46，P26 = 66.6 + 0.46(72.9 - 66.6) = 69.498；L83 = 17.43，P83 = 93.3 + 0.43(98.6 - 93.3) = 95.579；\nc. 箱形圖如圖所示。", "fig": "figures/ch4_q23.png", "card_img": "figures/cards/card_calc_ch4_q23.png", "lines": [], "badge": ""}, {"id": "calc_ch4_q25", "chapter": 4, "chapter_name": "展現與探索資料", "q_num": "第 4 章 習題 25", "title": "大眾運輸 vs 自行開車雙並列箱形圖比較", "question": "比較大眾運輸與自行開車通勤時間之雙並列箱形圖。\na. 寫出大眾運輸之五數摘要與四分位數。\nb. 寫出自行開車之五數摘要與四分位數。\nc. 比較兩組通勤時間之差異。", "answer": "a. Q1 = 26.25，Q3 = 35.75，中位數 = 31.50；\nb. Q1 = 33.25，Q3 = 38.75，中位數 = 37.50；\nc. 搭乘大眾運輸的員工所花時間的中位數少大約 6 分鐘。搭乘大眾運輸的員工所花時間的變異程度較大。搭乘大眾運輸的員工所花時間的 Q1 與 Q3 之差距是 9.5 分鐘。自行開車的員工所花時間的 Q1 與 Q3 之差距是 5.5 分鐘。", "fig": "figures/ch4_q25.png", "card_img": "figures/cards/card_calc_ch4_q25.png", "lines": [], "badge": ""}, {"id": "calc_ch4_q31", "chapter": 4, "chapter_name": "展現與探索資料", "q_num": "第 4 章 習題 31", "title": "城市汽車失竊數分布與偏態判定", "question": "7 大城市汽車失竊數資料，計算皮爾森偏態係數與軟體偏態係數並進行比較。", "answer": "sk = 0.065 或 sk = 3(7.7143 - 8.0)/3.9036 = -0.22。", "fig": "figures/ch4_q31.png", "card_img": "figures/cards/card_calc_ch4_q31.png", "lines": [], "badge": ""}, {"id": "calc_ch4_q35", "chapter": 4, "chapter_name": "展現與探索資料", "q_num": "第 4 章 習題 35", "title": "美國勞動力性別失業率對比長條圖", "question": "美國 20 歲以上性別與就業狀況列聯表。\na. 總勞動力人口是多少？\nb. 失業員工百分比是多少？\nc. 計算男性與女性失業百分比。", "answer": "a. 139,340,000；  b. 失業員工百分比 = 5.4%，由 (7,523/139,340) × 100% 得出；  c. 男性失業百分比 = 5.64%，女性失業百分比 = 5.12%。", "fig": "figures/ch4_q35.png", "card_img": "figures/cards/card_calc_ch4_q35.png", "lines": [], "badge": ""}, {"id": "calc_ch5_q29", "chapter": 5, "chapter_name": "機率觀念概述", "q_num": "第 5 章 習題 29", "title": "機率一般加法規則與文氏圖應用", "question": "水族箱中有 140 隻劍尾魚，依體色與性別分類。讓 A 代表魚是綠色的機率，B 代表魚是雄性的機率。\na. 求 P(A)。\nb. 求 P(B)。\nc. 求 P(A 且 B)。\nd. 求 P(A 或 B)。", "answer": "讓 A 代表魚是綠色的機率，B 代表魚是雄性的機率。\na. P(A) = 80/140 = 0.5714；\nb. P(B) = 60/140 = 0.4286；\nc. P(A 且 B) = 36/140 = 0.2571；\nd. P(A 或 B) = P(A) + P(B) - P(A 且 B) = 80/140 + 60/140 - 36/140 = 104/140 = 0.7429。", "fig": "figures/ch5_q29.png", "card_img": "figures/cards/card_calc_ch5_q29.png", "lines": [], "badge": ""}, {"id": "calc_ch5_q35", "chapter": 5, "chapter_name": "機率觀念概述", "q_num": "第 5 章 習題 35", "title": "雙向列聯表之邊際機率、條件機率與聯合機率", "question": "考慮雙向列聯表事件。\na. 求 P(A1)。\nb. 求 P(B1 | A2)。\nc. 求 P(B2 且 A3)。", "answer": "a. P(A1) = 3/10 = 0.30；  b. P(B1 | A2) = 1/3 = 0.33；  c. P(B2 且 A3) = 1/10 = 0.10。", "fig": "figures/ch5_q35.png", "card_img": "figures/cards/card_calc_ch5_q35.png", "lines": [], "badge": ""}, {"id": "calc_ch5_q41", "chapter": 5, "chapter_name": "機率觀念概述", "q_num": "第 5 章 習題 41", "title": "貝氏定理（Bayes' Theorem）雙分割事後機率推導", "question": "已知 P(A1) = 0.60, P(A2) = 0.40, P(B1 | A1) = 0.05, P(B1 | A2) = 0.10。\n利用貝氏定理求事後機率 P(A1 | B1)。", "answer": "P(A1 | B1) = [P(A1)P(B1|A1)] / [P(A1)P(B1|A1) + P(A2)P(B1|A2)] = (0.60 × 0.05) / [(0.60 × 0.05) + (0.40 × 0.10)] = 0.030 / 0.070 = 0.4286。", "fig": "figures/ch5_q41.png", "card_img": "figures/cards/card_calc_ch5_q41.png", "lines": [], "badge": ""}, {"id": "calc_ch5_q43", "chapter": 5, "chapter_name": "機率觀念概述", "q_num": "第 5 章 習題 43", "title": "棒球隊日夜賽贏球貝氏事後修正", "question": "小聯盟球隊有 70% 的比賽在夜間進行，30% 在白天進行。夜間贏球機率為 50%，白天贏球機率為 90%。已知該隊贏得一場比賽，求該場比賽是在夜間進行的事後機率 P(夜間 | 贏)。", "answer": "P(夜間 | 贏) = P(夜間)P(贏|夜間) / [P(夜間)P(贏|夜間) + P(白天)P(贏|白天)] = (0.70)(0.50) / [(0.70)(0.50) + (0.30)(0.90)] = 0.35 / 0.62 = 0.5645。", "fig": "figures/ch5_q43.png", "card_img": "figures/cards/card_calc_ch5_q43.png", "lines": [], "badge": ""}, {"id": "calc_ch5_q45", "chapter": 5, "chapter_name": "機率觀念概述", "q_num": "第 5 章 習題 45", "title": "百貨公司消費金額超額付款方式貝氏分析", "question": "百貨公司客戶使用現金、信用卡、簽帳卡的比例分別為 30%、30%、40%。各支付方式消費金額超過 $50 的機率分別為 20%、90%、60%。若某筆消費超過 $50，求其使用現金支付的事後機率 P(現金 | >$50)。", "answer": "P(現金 | > $50) = P(現金)P(>$50|現金) / [P(現金)P(>$50|現金) + P(信用卡)P(>$50|信用卡) + P(簽帳卡)P(>$50|簽帳卡)] = (0.30)(0.20) / [(0.30)(0.20) + (0.30)(0.90) + (0.40)(0.60)] = 0.060 / 0.570 = 0.1053。", "fig": "figures/ch5_q45.png", "card_img": "figures/cards/card_calc_ch5_q45.png", "lines": [], "badge": ""}, {"id": "calc_ch5_q59", "chapter": 5, "chapter_name": "機率觀念概述", "q_num": "第 5 章 習題 59", "title": "籃球半決賽獨立事件乘法規則", "question": "女子大學籃球賽半決賽，甲隊獲勝賠率換算機率為 2/3，乙隊獲勝機率為 3/4。假設兩場比賽互相獨立。\na. 兩隊皆晉級決賽的機率為何？\nb. 兩隊皆未晉級的機率為何？\nc. 至少有一隊晉級決賽的機率為何？", "answer": "a. 1/2，由 (2/3)(3/4) 得到；  b. 1/12，由 (1/3)(1/4) 得到；  c. 11/12，由 1 − 1/12 得到。", "fig": "figures/ch5_q59.png", "card_img": "figures/cards/card_calc_ch5_q59.png", "lines": [], "badge": ""}, {"id": "calc_ch5_q61", "chapter": 5, "chapter_name": "機率觀念概述", "q_num": "第 5 章 習題 61", "title": "男性存活獨立事件與對立事件互補", "question": "根據生命表，60 歲男性隔年仍存活的機率為 0.98。選取 5 位 60 歲男性。\na. 5 位隔年全部存活的機率是多少？\nb. 至少有一位在隔年過世的機率是多少？", "answer": "a. 0.9039，由 (0.98)^5 得到；  b. 0.0961，由 1 − 0.9039 得到。", "fig": "figures/ch5_q61.png", "card_img": "figures/cards/card_calc_ch5_q61.png", "lines": [], "badge": ""}, {"id": "calc_ch5_q67", "chapter": 5, "chapter_name": "機率觀念概述", "q_num": "第 5 章 習題 67", "title": "廣告記憶與讀報關聯條件機率", "question": "某地區 60% 居民訂閱報紙 (S)。在訂戶中，85% 能記住特定廣告 (R)。\na. 既是訂戶又能記住廣告的機率為何？\nb. 是訂戶但記不住該廣告的機率為何？", "answer": "a. P(S) × P(R | S) = 0.60 × 0.85 = 0.51；  b. P(S) × P(~R | S) = 0.60 × (1 − 0.85) = 0.09。", "fig": "figures/ch5_q67.png", "card_img": "figures/cards/card_calc_ch5_q67.png", "lines": [], "badge": ""}, {"id": "calc_ch5_q69", "chapter": 5, "chapter_name": "機率觀念概述", "q_num": "第 5 章 習題 69", "title": "微型記憶卡瑕疵抽驗互補原則", "question": "檢驗 1,000 張微型 SD 卡，其中 112 張有小瑕疵，31 張不能用，其餘為良品。\na. 隨機選取一張，不是良品的機率是多少？\nb. 若已知不是良品，它屬於不能用的條件機率是多少？", "answer": "a. P(不是良品) = P(小瑕疵) + P(不能用) = 112/1,000 + 31/1,000 = 0.143；  b. P(不能用 | 不是良品) = 0.031 / 0.143 = 0.217。", "fig": "figures/ch5_q69.png", "card_img": "figures/cards/card_calc_ch5_q69.png", "lines": [], "badge": ""}, {"id": "calc_ch5_q71", "chapter": 5, "chapter_name": "機率觀念概述", "q_num": "第 5 章 習題 71", "title": "服飾店發展前景與獲利貝氏決策樹", "question": "女性服飾店評估連鎖分店，優等、中等、劣等地點機率為 10%、60%、30%。各類地點第一年獲利的條件機率分別為 20%、80%、60%。若分店第一年獲利，求該地點為劣等地點的事後機率 P(劣等 | 有利潤)。", "answer": "P(劣等 | 有利潤) = 0.10(0.20) / [0.10(0.20) + 0.60(0.80) + 0.30(0.60)] = 0.020 / 0.680 = 0.0294。", "fig": "figures/ch5_q71.png", "card_img": "figures/cards/card_calc_ch5_q71.png", "lines": [], "badge": ""}, {"id": "calc_ch5_q73", "chapter": 5, "chapter_name": "機率觀念概述", "q_num": "第 5 章 習題 73", "title": "刮刮樂連續未中獎之對立事件分析", "question": "披薩店刮刮樂活動，刮中免費披薩機率為 0.10，刮中免費可樂機率為 0.02。\na. 顧客光顧一次獲得免費披薩或可樂的機率為何？\nb. 光顧一次完全未中獎的機率為何？\nc. 連續光顧 3 次皆未中獎的機率為何？\nd. 連續光顧 3 次中至少中獎一次的機率為何？", "answer": "a. 0.1 + 0.02 = 0.12；  b. 1 − 0.12 = 0.88；  c. (0.88)^3 = 0.6815；  d. 1 − 0.6815 = 0.3185。", "fig": "figures/ch5_q73.png", "card_img": "figures/cards/card_calc_ch5_q73.png", "lines": [], "badge": ""}, {"id": "calc_ch5_q87", "chapter": 5, "chapter_name": "機率觀念概述", "q_num": "第 5 章 習題 87", "title": "四家映像管供應商瑕疵品貝氏歸屬", "question": "四家供應商（Tyson, Fuji, Kirkpatricks, Parts）供應比例分別為 20%、30%、25%、25%，其產品瑕疵率分別為 3%、4%、7%、6.5%。\na. 隨機抽取一件零件，為瑕疵品的機率 P(D) 為何？\nb. 若抽得瑕疵品，其來自 Tyson 供應商的事後機率為何？", "answer": "a. P(D) = 0.20(0.03) + 0.30(0.04) + 0.25(0.07) + 0.25(0.065) = 0.05175；\nb. P(Tyson | 有瑕疵) = 0.20(0.03) / 0.05175 = 0.1159（修正表：Tyson 0.1159, Fuji 0.2319, Kirkpatricks 0.3382, Parts 0.3140）。", "fig": "figures/ch5_q87.png", "card_img": "figures/cards/card_calc_ch5_q87.png", "lines": [], "badge": ""}, {"id": "calc_ch6_q23", "chapter": 6, "chapter_name": "離散型機率分配", "q_num": "第 6 章 習題 23", "title": "二項分配 B(15, 0.70) 成功維修案件機率", "question": "維修工程師修復成功率為 0.70，隨機抽取 15 件維修個案。\na. 計算成功維修案件的平均數與標準差。\nb. 剛好成功修復 10 件的機率是多少？\nc. 剛好成功修復 10 或 11 件的機率是多少？\nd. 成功修復超過 10 件的機率是多少？", "answer": "a. μ = 10.5，由 15 × 0.7 得到。σ = √(15(0.7)(0.3)) = 1.7748；\nb. 0.2061，由 (15! / (10!5!)) (0.7)^10 (0.3)^5 得到；\nc. 0.4247，由 0.2061 + 0.2186 得到；\nd. 0.5154，由 0.2186 + 0.1700 + 0.0916 + 0.0305 + 0.0047 得到。", "fig": "figures/ch6_q23.png", "card_img": "figures/cards/card_calc_ch6_q23.png", "lines": [], "badge": ""}, {"id": "calc_ch6_q27", "chapter": 6, "chapter_name": "離散型機率分配", "q_num": "第 6 章 習題 27", "title": "超幾何機率分配：房地產價外貸款抽樣", "question": "母體共有 10 筆貸款，其中 3 筆為價外貸款。銀行審計人員隨機抽取 2 筆貸款。\n求抽取的 2 筆中沒有價外貸款 (x = 0) 的機率。", "answer": "N 是 10，即母體中的貸款數量；S 是 3，即母體中的價外貸款數量；x 是 0，即樣本中的價外貸款數量；n 是 2，即樣本大小。使用公式 (6-6) 求出 P(0) = (7C2)(3C0)/10C2 = 21(1)/45 = 0.4667。", "fig": "figures/ch6_q27.png", "card_img": "figures/cards/card_calc_ch6_q27.png", "lines": [], "badge": ""}, {"id": "calc_ch6_q29", "chapter": 6, "chapter_name": "離散型機率分配", "q_num": "第 6 章 習題 29", "title": "超幾何機率分配：送貨車煞車問題抽樣", "question": "15 輛送貨車中有 6 輛煞車有問題。隨機抽驗 5 輛車，求其中剛好有 2 輛煞車有問題的機率。", "answer": "P(2) = (9C3)(6C2) / 15C5 = 84(15) / 3,003 = 0.4196。", "fig": "figures/ch6_q29.png", "card_img": "figures/cards/card_calc_ch6_q29.png", "lines": [], "badge": ""}, {"id": "calc_ch6_q35", "chapter": 6, "chapter_name": "離散型機率分配", "q_num": "第 6 章 習題 35", "title": "卜瓦松分配近似二項客服占線機率", "question": "航空公司接到 1,200 通電話，每通電話被轉到客服人員的機率為 0.005。利用卜瓦松分配求至少有 5 通電話被轉接的機率。", "answer": "π (或 μ) = 6，P(x ≥ 5) = 1 − (0.0025 + 0.0149 + 0.0446 + 0.0892 + 0.1339) = 0.7149。", "fig": "figures/ch6_q35.png", "card_img": "figures/cards/card_calc_ch6_q35.png", "lines": [], "badge": ""}, {"id": "calc_ch6_q43", "chapter": 6, "chapter_name": "離散型機率分配", "q_num": "第 6 章 習題 43", "title": "二項分配 B(10, 0.35) 冰淇淋偏好調查", "question": "35% 的成年人偏好香草冰淇淋。隨機調查 10 位成年人。\na. 偏好香草冰淇淋的期望人數是多少？\nb. 剛好有 4 人偏好的機率是多少？\nc. 至少有 4 人偏好的機率是多少？", "answer": "a. μ = 10(0.35) = 3.5；\nb. P(x = 4) = 10C4 (0.35)^4 (0.65)^6 = 210(0.0150)(0.0754) = 0.2375；\nc. P(x ≥ 4) = 10Cx (0.35)^x (0.65)^(10-x) = 0.2375 + 0.1536 + … + 0.0000 = 0.4862。", "fig": "figures/ch6_q43.png", "card_img": "figures/cards/card_calc_ch6_q43.png", "lines": [], "badge": ""}, {"id": "calc_ch6_q47", "chapter": 6, "chapter_name": "離散型機率分配", "q_num": "第 6 章 習題 47", "title": "二項分配 B(20, 0.075) 職場嗑藥調查", "question": "某公司員工藥物檢驗呈陽性比例為 0.075。隨機抽驗 20 位員工。\na. 呈陽性人數的平均數與標準差為何？\nb. 沒有員工呈陽性的機率為何？\nc. 至少有一位員工呈陽性的機率為何？", "answer": "a. μ = 20(0.075) = 1.5，σ = √(20(0.075)(0.925)) = 1.1779；\nb. 0.2103，由 (20! / (0!20!)) (0.075)^0 (0.925)^20 得到；\nc. 0.7897，由 1 − 0.2103 得到。", "fig": "figures/ch6_q47.png", "card_img": "figures/cards/card_calc_ch6_q47.png", "lines": [], "badge": ""}, {"id": "calc_ch6_q55", "chapter": 6, "chapter_name": "離散型機率分配", "q_num": "第 6 章 習題 55", "title": "超幾何分配：律師事務所委員會成員", "question": "法律事務所 10 位合夥人中，有 7 位來自俄亥俄州，3 位來自肯塔基州。隨機選出 3 位組成委員會。\na. 剛好有 1 位來自肯塔基州的機率？\nb. 至少有 1 位來自肯塔基州的機率？", "answer": "a. P(1) = (7C2)(3C1)/10C3 = (21)(3)/120 = 0.5250；\nb. P(0) = (7C3)(3C0)/10C3 = (35)(1)/120 = 0.2917，P(x ≥ 1) = 1 − P(0) = 1 − 0.2917 = 0.7083。", "fig": "figures/ch6_q55.png", "card_img": "figures/cards/card_calc_ch6_q55.png", "lines": [], "badge": ""}, {"id": "calc_ch6_q57", "chapter": 6, "chapter_name": "離散型機率分配", "q_num": "第 6 章 習題 57", "title": "超幾何分配：警察局長面談代表性檢驗", "question": "警察局長候選人名單有 12 人，其中 4 人為少數族裔。市長隨機選出 4 人進行面談。\n求面談名單中沒有少數族裔 (x = 0) 的機率。", "answer": "P(x = 0) = (8C4)(4C0)/12C4 = 70/495 = 0.141。", "fig": "figures/ch6_q57.png", "card_img": "figures/cards/card_calc_ch6_q57.png", "lines": [], "badge": ""}, {"id": "calc_ch6_q63", "chapter": 6, "chapter_name": "離散型機率分配", "q_num": "第 6 章 習題 63", "title": "卜瓦松分配：每分鐘車輛失竊機率 (μ = 3.1)", "question": "美國每分鐘有 3.1 輛車失竊，失竊數符合卜瓦松分配 (μ = 3.1)。\na. 1 分鐘內剛好有 4 輛車失竊的機率是多少？\nb. 1 分鐘內沒有車子失竊的機率是多少？\nc. 1 分鐘內至少有一輛車失竊的機率是多少？", "answer": "a. 0.1733，由 (3.1)^4 e^(-3.1) / 4! 得出；\nb. 0.0450，由 (3.1)^0 e^(-3.1) / 0! 得出；\nc. 0.9550，由 1 − 0.0450 得出。", "fig": "figures/ch6_q63.png", "card_img": "figures/cards/card_calc_ch6_q63.png", "lines": [], "badge": ""}, {"id": "calc_ch6_q65", "chapter": 6, "chapter_name": "離散型機率分配", "q_num": "第 6 章 習題 65", "title": "卜瓦松分配：SpaceX 載人火箭發射風險", "question": "載人太空發射失敗機率為 1/276。預計發射 20 次。\n求預期失敗次數、零失敗機率、失敗 1 次機率，以及失敗超過 0 次的機率。", "answer": "μ = nπ = 20(1/276) = 0.0725；P(0) = (0.0725)^0 e^(-0.0725)/0! = 0.930；P(1) = (0.0725)^1 e^(-0.0725)/1! = 0.067；P(x > 0) = 1 − P(x = 0) = 1 − 0.930 = 0.070。", "fig": "figures/ch6_q65.png", "card_img": "figures/cards/card_calc_ch6_q65.png", "lines": [], "badge": ""}, {"id": "calc_ch7_q1", "chapter": 7, "chapter_name": "連續型機率分配", "q_num": "第 7 章 習題 1", "title": "均勻機率分配 U(6, 10) 參數與區間機率", "question": "連續隨機變數 X 依循 6 到 10 的均勻機率分配。\na. a 與 b 的值是多少？\nb. 計算平均數。\nc. 計算標準差。\nd. 顯示曲線下的總面積為 1。\ne. 計算 P(x > 7)。\nf. 計算 P(7 ≤ x ≤ 9)。\ng. 計算 P(x = 7.91)。", "answer": "a. b = 10，a = 6；\nb. μ = (6 + 10)/2 = 8；\nc. σ = √((10 - 6)^2 / 12) = 1.1547；\nd. 面積 = (1/(10 - 6)) · (10 - 6) = 1；\ne. P(x > 7) = (1/(10 - 6)) · (10 - 7) = 3/4 = 0.75；\nf. P(7 ≤ x ≤ 9) = (1/(10 - 6)) · (9 - 7) = 2/4 = 0.50；\ng. P(x = 7.91) = 0（對連續機率分配而言，某一點數值的面積為 0）。", "fig": "figures/ch7_q1.png", "card_img": "figures/cards/card_calc_ch7_q1.png", "lines": [], "badge": ""}, {"id": "calc_ch7_q5", "chapter": 7, "chapter_name": "連續型機率分配", "q_num": "第 7 章 習題 5", "title": "均勻機率分配應用：Flagstaff 降雨量機率", "question": "亞利桑那州 Flagstaff 七月份降雨量依循 0.5 到 3.00 英寸的均勻分配。\na. a 與 b 的值是多少？\nb. 計算平均數與標準差。\nc. 降雨量小於 1 英寸的機率是多少？\nd. 降雨量剛好為 1.00 英寸的機率是多少？\ne. 降雨量超過 1.5 英寸的機率是多少？", "answer": "a. a = 0.5，b = 3.00；\nb. μ = (0.5 + 3.00)/2 = 1.75，σ = √((3.00 - 0.50)^2 / 12) = 0.72；\nc. P(x < 1) = (1/(3.0 - 0.5)) · (1 - 0.5) = 0.5/2.5 = 0.2；\nd. 0，由 (1/(3.0 - 0.5)) · (1.0 - 1.0) 得到；\ne. P(x > 1.5) = (1/(3.0 - 0.5)) · (3.0 - 1.5) = 1.5/2.5 = 0.6。", "fig": "figures/ch7_q5.png", "card_img": "figures/cards/card_calc_ch7_q5.png", "lines": [], "badge": ""}, {"id": "calc_ch7_q7", "chapter": 7, "chapter_name": "連續型機率分配", "q_num": "第 7 章 習題 7", "title": "常態分配 N(20, 4) 標準化 z 值轉換與查表", "question": "常態分配隨機變數 X，平均數 μ = 20，標準差 σ = 4.0。\na. 數值 25 的 z 值是多少？\nb. X 落在 20 到 25 之間的機率是多少？\nc. X 小於 18 的機率是多少？", "answer": "a. 1.25，由 z = (25 - 20)/4.0 = 1.25 得到；\nb. 0.3944，查閱書末附表 3 得出；\nc. 0.3085，由 z = (18 - 20)/4.0 = -0.5 得到。在書末附表 3 中找到對應 z = -0.5 的面積是 0.1915。接著，0.5000 − 0.1915 = 0.3085。", "fig": "figures/ch7_q7.png", "card_img": "figures/cards/card_calc_ch7_q7.png", "lines": [], "badge": ""}, {"id": "calc_ch7_q9", "chapter": 7, "chapter_name": "連續型機率分配", "q_num": "第 7 章 習題 9", "title": "空服員時薪常態分配 N(29.81, 9.31) 區間機率", "question": "空服員時薪依循常態分配，平均數 μ = $29.81，標準差 σ = $9.31。\na. 時薪落在 $29.81 到 $35.00 之間的機率是多少？\nb. 時薪超過 $35.00 的機率是多少？\nc. 時薪少於 $20.00 的機率是多少？", "answer": "a. 0.2123，由 z = (35.00 - 29.81)/9.31 = 0.56 得到，然後在書末附表 3 中找到 z = 0.56 相應的面積是 0.2123；\nb. 0.2877，由 0.5000 − 0.2123 得到；\nc. 0.1469，由 z = (20.00 - 29.81)/9.31 = -1.05 得到。在書末附表 3 中找到 z = -1.05 相應的面積是 0.3531。接著，0.5000 − 0.3531 = 0.1469。", "fig": "figures/ch7_q9.png", "card_img": "figures/cards/card_calc_ch7_q9.png", "lines": [], "badge": ""}, {"id": "calc_ch7_q11", "chapter": 7, "chapter_name": "連續型機率分配", "q_num": "第 7 章 習題 11", "title": "常態分配 N(50, 4) 雙側跨度與同側機率判定", "question": "常態分配隨機變數，平均數 μ = 50，標準差 σ = 4.0。\na. 計算 P(44 ≤ x ≤ 55)。\nb. 計算 P(x > 55)。\nc. 計算 P(52 ≤ x ≤ 55)。", "answer": "a. 0.8276：先求出 z = -1.5，由 (44 - 50)/4 得出，以及 z = 1.25 = (55 - 50)/4。根據書末附表 3，介於 -1.5 到 0 之間的面積是 0.4332，而在 0 與 1.25 之間的面積是 0.3944。之後將這兩個面積相加，我們得到 0.4332 + 0.3944 = 0.8276；\nb. 0.1056，由 0.5000 − 0.3944 得到，其中 z = 1.25；\nc. 0.2029：回想對應 z = 1.25 的面積是 0.3944，以及對應 z = 0.5 的面積是 0.1915，由 (52 - 50)/4 得到。之後相減 0.3944 − 0.1915，就會得到 0.2029。", "fig": "figures/ch7_q11.png", "card_img": "figures/cards/card_calc_ch7_q11.png", "lines": [], "badge": ""}, {"id": "calc_ch7_q13", "chapter": 7, "chapter_name": "連續型機率分配", "q_num": "第 7 章 習題 13", "title": "2022 年退稅金額常態分配 N(3401, 82.5)", "question": "2022 年納稅人退稅金額依循常態分配，平均數為 $3,401，標準差為 $82.5。\na. 退稅金額超過 $3,500 的百分比是多少？\nb. 退稅金額介於 $3,500 與 $3,579 之間的百分比是多少？\nc. 退稅金額介於 $3,325 與 $3,579 之間的百分比是多少？", "answer": "a. 0.1151：首先使用公式 (7-5) 求出 $3,500 的 z 值，是 (3,500 - 3,401)/82.5，或 1.20。然後查閱書末附表 3 來找出 0 與 1.20 之間的面積，為 0.3849。最後，因為關注的面積是在 1.20 以上，所以將 0.5000 減去該機率。結果是 0.5000 – 0.3849，或 0.1151；\nb. 0.0997：使用公式 (7-5) 求出 $3,579 的 z 值，是 (3,579 - 3,401)/82.5，或 2.16。然後查閱書末附表 3 來找出標準常態曲線下的面積，該機率是 0.4846。因為這兩點（1.20 與 2.16）在平均數的同一邊，就將較大的機率減去較小的機率。結果是 0.4846 − 0.3849 = 0.0997；\nc. 0.8058：使用公式 (7-5) 算出 $3,325 的 z 值，是 -0.92，由 (3,325 - 3,401)/82.5 得到。相應的面積是 0.3212。因為 -0.92 與 2.16 在平均數的兩邊，就將相應的機率相加。因此，我們得到 0.3212 + 0.4846 = 0.8058。", "fig": "figures/ch7_q13.png", "card_img": "figures/cards/card_calc_ch7_q13.png", "lines": [], "badge": ""}, {"id": "calc_ch7_q15", "chapter": 7, "chapter_name": "連續型機率分配", "q_num": "第 7 章 習題 15", "title": "電台廣播收聽時間常態分配 N(15, 3.5)", "question": "上班族開車收聽電台新聞的平均時間為 15 分鐘，標準差為 3.5 分鐘。\na. 開車收聽時間超過 20 分鐘的機率為何？\nb. 開車收聽時間不超過 20 分鐘的機率為何？\nc. 開車收聽時間在 10 到 12 分鐘之間的機率為何？", "answer": "a. 0.0764，由以下過程得出：z = (20 - 15)/3.5 = 1.43，之後，0.5000 − 0.4236 = 0.0764；\nb. 0.9236，由 0.5000 + 0.4236 得到，其中 z = 1.43；\nc. 0.1185，由 z = (12 - 15)/3.5 = -0.86 得到。曲線下的面積是 0.3051，之後 z = (10 - 15)/3.5 = -1.43。面積是 0.4236。最後，0.4236 − 0.3051 = 0.1185。", "fig": "figures/ch7_q15.png", "card_img": "figures/cards/card_calc_ch7_q15.png", "lines": [], "badge": ""}, {"id": "calc_ch7_q21", "chapter": 7, "chapter_name": "連續型機率分配", "q_num": "第 7 章 習題 21", "title": "常態分配反查 z 值求極端 1% 百分位數門檻", "question": "個人電腦使用者聆聽串流音樂的時間依循常態分配。\na. 去年平均數為 195 小時，標準差為 8.5 小時。聆聽時間最高 1% 的使用者至少聽了多少小時？\nb. 4 年前平均數為 290 小時，標準差為 8.5 小時。聆聽時間最低 1% 的使用者至多聽了多少小時？", "answer": "a. 214.8 小時：找出介於 0 與 z 之間的面積是 0.4900 的 z 值。該 z 值是 2.33。然後解 x：2.33 = (x - 195)/8.5，所以 x = 214.8 小時；\nb. 270.2 小時：找出介於 0 與 (-z) 之間的面積是 0.4900 的 z 值。該 z 值是 -2.33。然後解 x：-2.33 = (x - 290)/8.5，所以 x = 270.2 小時。", "fig": "figures/ch7_q21.png", "card_img": "figures/cards/card_calc_ch7_q21.png", "lines": [], "badge": ""}, {"id": "calc_ch7_q37", "chapter": 7, "chapter_name": "連續型機率分配", "q_num": "第 7 章 習題 37", "title": "可樂罐裝容量均勻分配 U(11.96, 12.05)", "question": "某裝瓶廠可樂罐裝容量依循 11.96 到 12.05 盎司的均勻機率分配。\na. 計算平均容量。\nb. 計算標準差。\nc. 容量小於 12.00 盎司的機率是多少？\nd. 容量大於 11.98 盎司的機率是多少？\ne. 容量大於 11.00 盎司的機率是多少？", "answer": "a. μ = (11.96 + 12.05)/2 = 12.005；\nb. σ = √((12.05 - 11.96)^2 / 12) = 0.0260；\nc. P(x < 12) = (1/(12.05 - 11.96)) · ((12.00 - 11.96)/1) = 0.04/0.09 = 0.44；\nd. P(x > 11.98) = (1/(12.05 - 11.96)) · ((12.05 - 11.98)/1) = 0.07/0.09 = 0.78；\ne. 所有的可樂容量皆超過 11 盎司，所以機率是 100%。", "fig": "figures/ch7_q37.png", "card_img": "figures/cards/card_calc_ch7_q37.png", "lines": [], "badge": ""}, {"id": "calc_ch7_q39", "chapter": 7, "chapter_name": "連續型機率分配", "q_num": "第 7 章 習題 39", "title": "信用卡申請審核時間均勻分配 U(4, 10)", "question": "百貨公司信用卡審核時間依循 4 到 10 分鐘的均勻機率分配。\na. 計算平均審核時間。\nb. 計算審核時間的標準差。\nc. 審核時間小於 6 分鐘的機率是多少？\nd. 審核時間大於 5 分鐘的機率是多少？", "answer": "a. μ = (4 + 10)/2 = 7；\nb. σ = √((10 - 4)^2 / 12) = 1.732；\nc. P(x < 6) = (1/(10 - 4)) · ((6 - 4)/1) = 2/6 = 0.33；\nd. P(x > 5) = (1/(10 - 4)) · ((10 - 5)/1) = 5/6 = 0.83。", "fig": "figures/ch7_q39.png", "card_img": "figures/cards/card_calc_ch7_q39.png", "lines": [], "badge": ""}, {"id": "calc_ch7_q31", "chapter": 7, "chapter_name": "連續型機率分配", "q_num": "第 7 章 習題 31【指數分配參考題，已劃叉不考】", "title": "Subway 潛艇堡等候時間指數分配 (λ = 1/60)", "question": "Subway 顧客點餐等候時間依循指數機率分配，平均等候時間為 60 秒 (μ = 60)。\na. 等候時間不到 30 秒的機率？\nb. 等候時間超過 120 秒的機率？\nc. 等候時間在 45 到 75 秒之間的機率？\nd. 50% 顧客等候時間少於多少秒（中位數）？", "answer": "a. 0.3935，由 1 − e^[(-1/60)(30)] 得出；\nb. 0.1353，由 e^[(-1/60)(120)] 得出；\nc. 0.1859，由 e^[(-1/60)(45)] − e^[(-1/60)(75)] 得出；\nd. 41.59 秒，由 -60 ln(0.5) 得出。", "fig": "figures/ch7_q31.png", "card_img": "figures/cards/card_calc_ch7_q31.png", "lines": [], "badge": ""}, {"id": "calc_ch7_q57", "chapter": 7, "chapter_name": "連續型機率分配", "q_num": "第 7 章 習題 57【指數分配參考題，已劃叉不考】", "title": "電腦開機時間指數分配 (λ = 1/27)", "question": "某新型電腦開機時間依循指數機率分配，平均開機時間為 27 秒 (μ = 27)。\na. 開機時間不超過 15 秒的機率？\nb. 開機時間超過 60 秒的機率？\nc. 開機時間在 30 到 45 秒之間的機率？\nd. 前 10% 最快完成開機的時間門檻為何？", "answer": "a. 0.4262，由 1 − e^[(-1/27)(15)] 得出；\nb. 0.1084，由 e^[(-1/27)(60)] 得出；\nc. 0.1403，由 e^[(-1/27)(30)] − e^[(-1/27)(45)] 得出；\nd. 2.84 秒，由 -27 ln(0.9) 得出。", "fig": "figures/ch7_q57.png", "card_img": "figures/cards/card_calc_ch7_q57.png", "lines": [], "badge": ""}];
    let currentChapter = 0;

    function renderCards() {
        const keyword = document.getElementById('search-input').value.trim().toLowerCase();
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        const filtered = questionsData.filter(q => {
            const matchCh = (currentChapter === 0) || (q.chapter === currentChapter);
            const matchKw = !keyword || 
                q.q_num.toLowerCase().includes(keyword) ||
                q.title.toLowerCase().includes(keyword) ||
                q.question.toLowerCase().includes(keyword) ||
                q.answer.toLowerCase().includes(keyword);
            return matchCh && matchKw;
        });

        if (filtered.length === 0) {
            container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text-muted); font-size:16px;">無符合條件的題目，請重新輸入關鍵字。</div>';
            return;
        }

        filtered.forEach(q => {
            const card = document.createElement('div');
            card.className = 'card';

            let calcStepsHtml = '';
            q.lines.forEach((l, idx) => {
                calcStepsHtml += `
                    <div class="calc-step">
                        <span class="step-badge">步驟 ${idx + 1}</span>
                        <strong>${l.label}</strong> <code>${l.math}</code> ${l.unit}
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">${q.q_num}</span>
                    <span class="card-pill">第 ${q.chapter} 章</span>
                </div>
                <div class="card-body">
                    <div style="font-weight:700; font-size:15px; color:var(--navy-accent);">${q.title}</div>
                    <div class="q-box">${q.question}</div>
                    <div class="calc-box" style="padding:4px; background:#F8FAFC;">
                        <img src="${q.card_img}" style="width:100%; height:auto; display:block; border-radius:6px;" alt="核心公式與計算歷程圖解">
                    </div>
                    <div class="ans-badge">
                        ${q.answer}
                    </div>
                    <div class="chart-preview" onclick="openModal('${q.fig}', '${q.q_num} - ${q.title}')">
                        <img src="${q.fig}" alt="統計圖表" loading="lazy" onerror="this.style.display='none'">
                        <div class="chart-caption">🔍 點擊放大查看 300 DPI 分配圖形</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function setChapter(ch, btn) {
        currentChapter = ch;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCards();
    }

    function toggleTheme() {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    }

    function openModal(src, caption) {
        document.getElementById('modal-img').src = src;
        document.getElementById('modal-caption').innerText = caption;
        document.getElementById('image-modal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('image-modal').classList.remove('open');
    }

    // 初始化渲染
    renderCards();
</script>
</body>
</html>
