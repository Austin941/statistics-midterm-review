<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商用統計學期中總複習 ＆ 考點互動刷題系統</title>
    <style>
        :root {
            --bg-base: #F8FAFC;
            --bg-surface: #FFFFFF;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --border-subtle: #E2E8F0;
            --border-strong: #CBD5E1;
            --navy-primary: #0F2847;
            --navy-secondary: #1E3E62;
            --navy-accent: #1F4E79;
            --emerald-bg: #ECFDF5;
            --emerald-border: #10B981;
            --emerald-text: #065F46;
            --danger-bg: #FEF2F2;
            --danger-border: #EF4444;
            --danger-text: #991B1B;
            --amber-bg: #FFFBEB;
            --amber-border: #F59E0B;
            --amber-text: #92400E;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 3px rgba(15, 40, 71, 0.06);
            --shadow-md: 0 4px 16px rgba(15, 40, 71, 0.07);
            --shadow-lg: 0 10px 30px rgba(15, 40, 71, 0.12);
            --spring-transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

        [data-theme="dark"] {
            --bg-base: #0B1120;
            --bg-surface: #131D33;
            --bg-card: #18233D;
            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --border-subtle: #243252;
            --border-strong: #33446B;
            --navy-primary: #1E3A8A;
            --navy-secondary: #2563EB;
            --navy-accent: #3B82F6;
            --emerald-bg: #064E3B;
            --emerald-border: #059669;
            --emerald-text: #A7F3D0;
            --danger-bg: #450A0A;
            --danger-border: #DC2626;
            --danger-text: #FECACA;
            --amber-bg: #451A03;
            --amber-border: #D97706;
            --amber-text: #FDE68A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--navy-primary) 0%, var(--navy-secondary) 100%);
            color: white;
            padding: 24px 20px 20px;
            box-shadow: 0 4px 24px rgba(15, 40, 71, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand-wrap h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-pill {
            font-size: 11.5px;
            font-weight: 700;
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 2px 10px;
            border-radius: var(--radius-full);
            letter-spacing: 0.3px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--spring-transition);
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-1px);
        }

        /* Mode Switcher Bar */
        .mode-switcher {
            display: flex;
            background: rgba(0, 0, 0, 0.22);
            padding: 4px;
            border-radius: 12px;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .mode-btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 9px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.82);
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--spring-transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .mode-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }
        .mode-btn.active {
            background: white;
            color: var(--navy-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        [data-theme="dark"] .mode-btn.active {
            background: var(--navy-accent);
            color: white;
        }

        /* Container */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 20px 60px;
            width: 100%;
            flex: 1;
        }

        /* Alert Banner */
        .alert-banner {
            background: #FEF2F2;
            border: 1.5px solid #F87171;
            border-left: 6px solid #DC2626;
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            color: #7F1D1D;
            font-size: 13.5px;
        }
        [data-theme="dark"] .alert-banner {
            background: #450A0A;
            border-color: #B91C1C;
            color: #FECACA;
        }
        .alert-banner strong { color: #B91C1C; }
        [data-theme="dark"] .alert-banner strong { color: #FCA5A5; }

        /* Toolbar & Controls */
        .toolbar {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 14.5px;
            border: 1.5px solid var(--border-strong);
            border-radius: 10px;
            outline: none;
            background: var(--bg-card);
            color: var(--text-primary);
            transition: var(--spring-transition);
        }
        .search-box:focus { border-color: var(--navy-accent); box-shadow: 0 0 0 3px rgba(31, 78, 121, 0.15); }
        
        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .tab-btn {
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--spring-transition);
        }
        .tab-btn:hover { border-color: var(--navy-accent); color: var(--navy-accent); }
        .tab-btn.active {
            background: var(--navy-accent);
            border-color: var(--navy-accent);
            color: white;
        }

        /* View 1: Homework Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            transition: var(--spring-transition);
        }
        .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .card-header {
            background: var(--navy-primary);
            color: white;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title { font-size: 15px; font-weight: 700; }
        .card-pill {
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
        .q-box {
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-left: 4px solid var(--navy-accent);
            padding: 12px;
            border-radius: 8px;
            font-size: 13.5px;
            color: var(--text-secondary);
            white-space: pre-line;
        }
        .calc-preview {
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            overflow: hidden;
            background: #FFFFFF;
            cursor: pointer;
        }
        .calc-preview img { width: 100%; height: auto; display: block; }
        .ans-badge {
            background: var(--emerald-bg);
            border: 1.2px solid var(--emerald-border);
            border-left: 4px solid var(--emerald-border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--emerald-text);
        }
        .chart-preview {
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            background: white;
            text-align: center;
        }
        .chart-preview img { width: 100%; height: 180px; object-fit: contain; display: block; }
        .chart-caption { font-size: 11.5px; color: var(--text-muted); padding: 4px; background: var(--bg-base); }

        /* View 2: Quiz System */
        .quiz-view {
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        .quiz-view.active { display: flex; }
        .hw-view { display: none; }
        .hw-view.active { display: block; }

        /* Quiz Stats Bar */
        .quiz-dashboard {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow-sm);
        }
        .stat-group {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .stat-val {
            font-size: 20px;
            font-weight: 800;
            color: var(--navy-accent);
        }
        .stat-val.correct { color: #059669; }
        .stat-val.wrong { color: #DC2626; }

        .progress-bar-wrap {
            width: 100%;
            height: 8px;
            background: var(--border-subtle);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #10B981, #059669);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Quiz Cards */
        .quiz-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 22px;
            box-shadow: var(--shadow-sm);
            transition: var(--spring-transition);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .quiz-card:hover { box-shadow: var(--shadow-md); }
        .quiz-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        .quiz-q-num {
            font-size: 13px;
            font-weight: 800;
            color: var(--navy-accent);
            background: var(--bg-base);
            padding: 3px 10px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
        }
        .quiz-badges {
            display: flex;
            gap: 6px;
        }
        .quiz-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            background: #EEF2F6;
            color: #334155;
        }
        [data-theme="dark"] .quiz-tag {
            background: #243252;
            color: #CBD5E1;
        }
        .quiz-tag.category {
            background: #E0E7FF;
            color: #3730A3;
        }
        [data-theme="dark"] .quiz-tag.category {
            background: #312E81;
            color: #C7D2FE;
        }

        .quiz-question-text {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.5;
            color: var(--text-primary);
        }

        /* Options Grid */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-item {
            background: var(--bg-card);
            border: 1.5px solid var(--border-strong);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14.5px;
            cursor: pointer;
            transition: var(--spring-transition);
            display: flex;
            align-items: center;
            gap: 12px;
            user-select: none;
        }
        .option-item:hover:not(.locked) {
            border-color: var(--navy-accent);
            background: var(--bg-base);
            transform: translateX(3px);
        }
        .option-item.locked { cursor: default; }
        .opt-letter {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--border-subtle);
            color: var(--text-secondary);
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            transition: var(--spring-transition);
        }
        
        /* Selected States */
        .option-item.correct {
            border-color: var(--emerald-border);
            background: var(--emerald-bg);
            color: var(--emerald-text);
        }
        .option-item.correct .opt-letter {
            background: var(--emerald-border);
            color: white;
        }
        .option-item.wrong {
            border-color: var(--danger-border);
            background: var(--danger-bg);
            color: var(--danger-text);
        }
        .option-item.wrong .opt-letter {
            background: var(--danger-border);
            color: white;
        }

        /* Explanation Box */
        .analysis-box {
            display: none;
            background: #F8FAFC;
            border: 1.5px solid var(--border-strong);
            border-left: 5px solid #059669;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 13.5px;
            color: var(--text-secondary);
            animation: fadeIn 0.25s ease;
        }
        [data-theme="dark"] .analysis-box {
            background: #111C33;
            border-color: #243252;
            border-left-color: #10B981;
        }
        .analysis-box.show { display: block; }
        .analysis-title {
            font-weight: 800;
            color: #065F46;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        [data-theme="dark"] .analysis-title { color: #34D399; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            border: 1px dashed var(--border-strong);
            color: var(--text-muted);
        }
        .empty-icon { font-size: 40px; margin-bottom: 12px; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.open { display: flex; }
        .modal-content {
            max-width: 900px;
            width: 100%;
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            position: relative;
        }
        .modal-content img { width: 100%; height: auto; max-height: 75vh; object-fit: contain; }
        .close-btn {
            position: absolute;
            top: 12px; right: 16px;
            font-size: 26px;
            font-weight: bold;
            color: var(--text-primary);
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: 1fr; }
            .quiz-dashboard { flex-direction: column; align-items: flex-start; }
            .brand-wrap h1 { font-size: 18px; }
            .mode-btn { font-size: 13.5px; padding: 8px 10px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="header-top">
            <div class="brand-wrap">
                <span class="brand-pill">商用統計學・期中考備戰神器</span>
                <h1>商用統計學期中總複習 ＆ 考點互動刷題系統</h1>
            </div>
            <div class="header-actions">
                <button class="nav-btn" onclick="toggleTheme()">🌓 切換深淺色</button>
                <a href="商用統計學期中總複習速查講義.pdf" target="_blank" download class="nav-btn">📥 下載作業速查 PDF (63頁)</a>
                <a href="商用統計學期中考_全章節高頻考點選擇題與解析.md" target="_blank" class="nav-btn">📝 選擇題庫解析 MD</a>
            </div>
        </div>

        <!-- 雙核心功能切換器 -->
        <div class="mode-switcher">
            <button id="btn-mode-hw" class="mode-btn active" onclick="switchMainMode('hw')">
                📑 功能一：作業題目與詳細解析速查 (62 題)
            </button>
            <button id="btn-mode-quiz" class="mode-btn" onclick="switchMainMode('quiz')">
                🎯 功能二：期中常考重點互動刷題 (76 題選擇題)
            </button>
        </div>
    </div>
</header>

<div class="container">
    <!-- 範圍重要提醒 -->
    <div class="alert-banner">
        <div style="font-size:22px; flex-shrink:0;">⚠️</div>
        <div>
            <strong>【期中考重點提醒：第 7 章指數分配不考】</strong><br>
            依據課本目錄照片原稿標記，「7.5 指數分配族系（習題 31、57 題）」明確不考！作業速查與刷題題庫均已精準對齊官方範圍。
        </div>
    </div>

    <!-- ==================== 功能一：作業速查 VIEW ==================== -->
    <div id="hw-view" class="hw-view active">
        <div class="toolbar">
            <input type="text" id="hw-search-input" class="search-box" placeholder="🔍 即時搜尋題號、題目關鍵字、統計名詞 (例如：23, 二項分配, 離群值, 柴比雪夫, 期望值)..." oninput="renderHwCards()">
            <div class="filter-tabs">
                <button class="tab-btn active" onclick="setHwChapter(0, this)">全部作業試題 (62)</button>
                <button class="tab-btn" onclick="setHwChapter(2, this)">第 2 章：次數分配與圖形 (12)</button>
                <button class="tab-btn" onclick="setHwChapter(3, this)">第 3 章：數值的測量 (8)</button>
                <button class="tab-btn" onclick="setHwChapter(4, this)">第 4 章：展現與探索資料 (8)</button>
                <button class="tab-btn" onclick="setHwChapter(5, this)">第 5 章：機率觀念概述 (12)</button>
                <button class="tab-btn" onclick="setHwChapter(6, this)">第 6 章：離散型機率分配 (10)</button>
                <button class="tab-btn" onclick="setHwChapter(7, this)">第 7 章：連續型機率分配 (10+2)</button>
            </div>
        </div>

        <div id="hw-cards-container" class="cards-grid"></div>
    </div>

    <!-- ==================== 功能二：考點刷題 VIEW ==================== -->
    <div id="quiz-view" class="quiz-view">
        <!-- 刷題儀表板 -->
        <div class="quiz-dashboard">
            <div class="stat-group">
                <div class="stat-item">
                    <span class="stat-label">題庫總數</span>
                    <span class="stat-val" id="stat-total">76 題</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">已作答</span>
                    <span class="stat-val" id="stat-answered">0 題</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">正確題數</span>
                    <span class="stat-val correct" id="stat-correct">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">錯誤題數</span>
                    <span class="stat-val wrong" id="stat-wrong">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">當前正確率</span>
                    <span class="stat-val" id="stat-rate">0%</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="nav-btn" style="color:var(--text-primary); border-color:var(--border-strong); background:var(--bg-card);" onclick="toggleWrongOnly(this)">
                    ❌ 錯題本 (<span id="wrong-count-badge">0</span>)
                </button>
                <button class="nav-btn" style="color:var(--text-primary); border-color:var(--border-strong); background:var(--bg-card);" onclick="shuffleQuiz()">
                    🔀 隨機題序
                </button>
                <button class="nav-btn" style="color:var(--text-primary); border-color:var(--border-strong); background:var(--bg-card);" onclick="resetQuiz()">
                    🔄 重置進度
                </button>
            </div>
            <div class="progress-bar-wrap">
                <div id="quiz-progress-fill" class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- 刷題篩選工具列 -->
